name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Check repository contents
        run: python tools/audit_repository.py
      - name: Check Python syntax
        run: python -m compileall -q app tests tools
      - name: Check JavaScript syntax
        run: node --check web/app.js
      - name: Run system scenario checks
        run: python -m unittest discover -s tests -v
      - name: Validate isolated synthetic demo
        run: python tools/create_demo.py
