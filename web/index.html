<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f7f2" />
    <meta
      name="description"
      content="拾光，一本属于你的本地智能日记。留住日常，理清思绪。"
    />
    <title>拾光 · 留住日常</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/about.js" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div id="connection-banner" class="connection-banner" hidden>
      本地服务暂时未连接。你的输入会保留，请重新启动拾光后刷新。
    </div>
    <div class="app-shell">
      <aside class="sidebar">
        <a href="#record" data-view="record" class="brand" aria-label="拾光首页"
          ><span class="brand-symbol" aria-hidden="true">拾</span
          ><span
            ><strong>拾光<span class="brand-dot">.</span></strong
            ><small>A LITTLE OF EVERY DAY</small></span
          ></a
        >
        <div class="workspace-label">我的空间 <span>PERSONAL</span></div>
        <nav class="main-nav" aria-label="主导航">
          <button data-view="record" class="nav-item active">
            <span data-icon="book"></span><span>日常记录</span
            ><span class="nav-shortcut">01</span>
          </button>
          <button data-view="review" class="nav-item">
            <span data-icon="sparkles"></span><span>每日回顾</span
            ><span class="nav-shortcut">02</span>
          </button>
          <button data-view="actions" class="nav-item">
            <span data-icon="check"></span><span>行动清单</span
            ><span id="action-count" class="count-badge">0</span>
          </button>
          <button data-view="about" class="nav-item">
            <span data-icon="leaf"></span><span>关于我</span
            ><span class="nav-shortcut">04</span>
          </button>
        </nav>
        <div class="calendar-section">
          <div class="calendar-heading">
            <span id="calendar-month"></span
            ><span
              ><button id="month-prev" class="icon-button" aria-label="上个月">
                <span data-icon="chevron-left"></span></button
              ><button id="month-next" class="icon-button" aria-label="下个月">
                <span data-icon="chevron-right"></span></button
            ></span>
          </div>
          <div class="calendar-week">
            <span>一</span><span>二</span><span>三</span><span>四</span
            ><span>五</span><span>六</span><span>日</span>
          </div>
          <div id="calendar-grid" class="calendar-grid"></div>
          <button id="go-today" class="back-today">
            回到今天 <span>↗</span>
          </button>
        </div>
        <div class="sidebar-note">
          <span class="note-line"></span>
          <p>日子值得被记住，<br />你也是。</p>
          <span class="note-line short"></span>
        </div>
        <div class="sidebar-bottom">
          <button data-view="settings" class="nav-item">
            <span data-icon="settings"></span><span>偏好与设置</span>
          </button>
          <div class="local-caption">
            <span class="status-dot"></span>私有 · 保存在这台电脑
          </div>
        </div>
      </aside>
      <div class="workspace">
        <header class="topbar">
          <div class="breadcrumb">
            我的日记<span>/</span><span id="topbar-context">日常记录</span>
          </div>
          <div class="topbar-right">
            <div class="search-wrap">
              <span data-icon="search"></span
              ><input
                id="search"
                aria-label="搜索日记"
                placeholder="寻找一个片段…"
                autocomplete="off"
              /><kbd>Ctrl K</kbd>
            </div>
            <span class="local-pill"
              ><span data-icon="shield"></span>本地私有</span
            ><button
              id="toggle-insights"
              class="icon-button panel-toggle"
              aria-label="展开或收起整理面板"
            >
              <span data-icon="panel"></span>
            </button>
          </div>
        </header>
        <div id="content-layout" class="content-layout">
          <main id="main-content" class="main-content" tabindex="-1">
            <section id="record-view" class="view">
              <div class="page-heading">
                <div>
                  <div class="eyebrow" id="day-eyebrow">TODAY, A NEW PAGE</div>
                  <h1 id="day-title">留住日常</h1>
                  <p id="day-subtitle">让零散的日常，慢慢有迹可循。</p>
                </div>
                <div class="date-emblem">
                  <span id="emblem-month">OCT</span
                  ><strong id="emblem-day">19</strong
                  ><span id="emblem-weekday">MONDAY</span>
                </div>
              </div>
              <div class="composer" id="composer">
                <div class="composer-title">
                  <span class="writing-mark" data-icon="pen"></span
                  ><span id="composer-heading">这一刻，你想记下什么？</span
                  ><span id="draft-status" class="draft-status"
                    >只管写下来</span
                  >
                </div>
                <label class="sr-only" for="entry-body">日记内容</label
                ><textarea
                  id="entry-body"
                  placeholder="一件小事、一个想法，或是还没理清的心情。&#10;从这里开始，写给自己。"
                  maxlength="60000"
                ></textarea>
                <div class="composer-options">
                  <label class="date-input-wrap"
                    ><span data-icon="calendar"></span
                    ><input
                      id="entry-day"
                      type="date"
                      aria-label="记录所属日期" /></label
                  ><label class="subtle-check"
                    ><input id="entry-ai" type="checkbox" checked /><span
                      >允许 AI 整理</span
                    ></label
                  >
                </div>
                <div class="composer-footer">
                  <span id="composer-hint"
                    ><span class="tiny-dot"></span>原文会被完整保留</span
                  >
                  <div class="composer-buttons">
                    <button id="cancel-edit" class="text-button" hidden>
                      取消编辑</button
                    ><span class="save-shortcut">Ctrl ↵</span
                    ><button id="save-entry" class="primary-button">
                      存下这一刻<span data-icon="arrow-up-right"></span>
                    </button>
                  </div>
                </div>
              </div>
              <div class="section-heading">
                <h2 id="timeline-heading">
                  今天的片段 <span id="entry-count">0</span>
                </h2>
                <div class="timeline-caption">从最近的一刻开始</div>
              </div>
              <div id="entries" class="entries"></div>
            </section>
            <section id="review-view" class="view" hidden></section>
            <section id="actions-view" class="view" hidden></section>
            <section id="settings-view" class="view" hidden></section>
            <section id="about-view" class="view" hidden></section>
            <footer class="page-footer">
              <span>每个平凡的日子，都有自己的纹理。</span
              ><span>拾光 · YOUR DAYS, WELL KEPT</span>
            </footer>
          </main>
          <aside
            id="insights-panel"
            class="insights-panel"
            aria-label="每日整理"
          ></aside>
        </div>
      </div>
    </div>
    <div id="toast" class="toast" role="status" hidden>
      <span id="toast-message"></span
      ><button id="toast-undo" hidden>撤销</button
      ><button id="toast-close" aria-label="关闭提示">×</button>
    </div>
    <dialog id="modal" class="modal"><div id="modal-content"></div></dialog>
  </body>
</html>
